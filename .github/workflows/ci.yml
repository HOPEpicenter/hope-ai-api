name: CI - Build + Regression + Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NODE_ENV: test
      # Express app expects this key for smoke script requests
      HOPE_API_KEY: ${{ secrets.HOPE_API_KEY }}

      # Storage for Azurite (Tables/Blob/Queue) via local emulator
      AzureWebJobsStorage: UseDevelopmentStorage=true
      STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true

      # Express port
      PORT: "3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps (npm ci)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund

      - name: Guard (no @azure/functions under src)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run guard


      - name: Guard scripts (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/guard-scripts.ps1

      - name: Build (tsc)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build

      - name: Authorization regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx ts-node tests/authorization/formationMutationActor.test.ts
          npx ts-node tests/authorization/pastoralAuthorization.test.ts
          npx ts-node tests/authorization/highRiskStaffVisibility.test.ts
          npx ts-node tests/authorization/sixWeekPastoralAuthorization.test.ts

      - name: Ministry Area foundation regressions
        shell: pwsh
        env:
          STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
        run: |
          $ErrorActionPreference = "Stop"
          npx ts-node tests/ministryAreas/ministryAreaCommands.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx ts-node tests/ministryAreas/ministryAreaAuthorization.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Staff Ministry Area linkage regression
        shell: pwsh
        env:
          STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
        run: |
          npx ts-node tests/staff/staffMinistryAreaLinkage.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Six-week visitor follow-up regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx ts-node tests/followups/projectSixWeekVisitorFollowup.test.ts
          npx ts-node tests/followups/sixWeekVisitorFollowupCommands.test.ts
          npx ts-node tests/followups/deriveSixWeekRetentionSummary.test.ts
          npx ts-node tests/communications/evaluateMinistryCommunicationDeliveryEligibility.test.ts
          npx ts-node tests/communications/phase5CommunicationContracts.test.ts
          npx ts-node tests/communications/ministryEmailRecipientPolicy.test.ts
          npx ts-node tests/communications/requestMinistryEmailDelivery.test.ts
          npx ts-node tests/communications/postMinistryEmailDeliveryRequest.test.ts
          npx ts-node tests/communications/postMinistryEmailDeliveryDispatch.test.ts
          npx ts-node tests/communications/claimMinistryEmailDeliveryDispatch.test.ts
          npx ts-node tests/communications/executeRequestedMinistryEmailDelivery.test.ts
          npx ts-node tests/communications/persistMinistryEmailDeliveryProviderResult.test.ts
          npx ts-node tests/communications/dispatchMinistryEmailDelivery.test.ts
          npx ts-node tests/communications/readMinistryEmailDispatchInspection.test.ts
          npx ts-node tests/communications/getMinistryEmailDispatchInspection.test.ts
          npx ts-node tests/communications/ministryEmailDispatchRecoveryRepository.test.ts
          npx ts-node tests/communications/resolveMinistryEmailDispatchRecovery.test.ts
          npx ts-node tests/communications/postMinistryEmailDispatchRecovery.test.ts
          npx ts-node tests/communications/voidMinistryEmailDelivery.test.ts
          npx ts-node tests/communications/postMinistryEmailDeliveryVoid.test.ts
          npx ts-node tests/communications/dispatchMinistryEmailDeliveryVoided.test.ts
          npx ts-node tests/communications/readMinistryEmailDispatchInspectionVoided.test.ts
          npx ts-node tests/communications/ministryEmailDeliveryVoidContract.test.ts
          npx ts-node tests/communications/normalizeSendGridProviderEvent.test.ts
          npx ts-node tests/communications/ministryEmailProviderEvidenceRepository.test.ts
          npx ts-node tests/communications/persistMinistryEmailProviderEvidence.test.ts
          npx ts-node tests/communications/verifySendGridEventWebhook.test.ts
          npx ts-node tests/communications/postMinistryEmailEventWebhook.test.ts
          npx ts-node tests/followups/confirmHistoricalSixWeekCareOutcome.test.ts

      - name: Dashboard visitor identity regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx ts-node tests/dashboard/resolveCanonicalVisitorDisplayName.test.ts

      - name: Regression target normalization assert
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/assert-regression-target-normalization.ps1
      - name: Express smoke (Azurite owned by script)
        shell: pwsh
        env:
          STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
          OPS_AZURITE_FRESH: "1"
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/ci-run-express-smoke.ps1

      - name: Dump Express logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "==== EXPRESS OUT (tail 200) ====" -ForegroundColor Yellow
          if ($env:EXPRESS_OUT_LOG -and (Test-Path $env:EXPRESS_OUT_LOG)) { Get-Content $env:EXPRESS_OUT_LOG -Tail 200 }
          Write-Host "==== EXPRESS ERR (tail 200) ====" -ForegroundColor Yellow
          if ($env:EXPRESS_ERR_LOG -and (Test-Path $env:EXPRESS_ERR_LOG)) { Get-Content $env:EXPRESS_ERR_LOG -Tail 200 }
