name: Deploy hope-ai-api-staging to Azure Functions

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source commit
        shell: pwsh
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if (
            $env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$' -or
            $LASTEXITCODE -ne 0 -or
            $checkedOutSha -cne $env:TARGET_SHA
          ) {
            throw 'The staging source checkout does not match the workflow target SHA.'
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript -> dist)
        run: npm run build

      - name: Copy function.json to root (required for discovery)
        run: npm run copy

      - name: Verify Functions layout
        run: npm run verify:layout

      - name: Prepare runtime dependencies
        run: npm prune --omit=dev


      - name: Validate Azure OIDC inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace("${{ secrets.AZURE_CLIENT_ID }}")) {
            throw "AZURE_CLIENT_ID is missing or empty."
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.AZURE_TENANT_ID }}")) {
            throw "AZURE_TENANT_ID is missing or empty."
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.AZURE_SUBSCRIPTION_ID }}")) {
            throw "AZURE_SUBSCRIPTION_ID is missing or empty."
          }

          Write-Host "Azure OIDC secret presence check passed."
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via ARM config-zip (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rg = "rg-hope-ai-api-staging"
          $app = "hope-ai-api-staging"

          # Configure app settings via Azure CLI / ARM (avoid flaky Kudu /api/settings)
          az functionapp config appsettings set `
            --resource-group $rg `
            --name $app `
            --settings `
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true `
              SCM_DO_BUILD_DURING_DEPLOYMENT=false `
              ENABLE_ORYX_BUILD=false | Out-Null

          Write-Host "App settings updated via Azure CLI."

          # Build once in CI, then deploy the exact classic-Functions layout as a ZIP.
          # This avoids the failing Functions Core Tools npm installation.
          $packagePath = Join-Path $env:RUNNER_TEMP "$app.zip"
          $functionDirectories = @(
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Directory |
              Where-Object {
                Test-Path -LiteralPath (Join-Path $_.FullName "function.json")
              } |
              ForEach-Object { $_.FullName }
          )

          $deploymentItems = @(
            (Join-Path $env:GITHUB_WORKSPACE "host.json")
            (Join-Path $env:GITHUB_WORKSPACE "package.json")
            (Join-Path $env:GITHUB_WORKSPACE "package-lock.json")
            (Join-Path $env:GITHUB_WORKSPACE "dist")
            (Join-Path $env:GITHUB_WORKSPACE "node_modules")
          ) + $functionDirectories

          if ($functionDirectories.Count -eq 0) {
            throw "No root function.json folders were found for deployment."
          }

          Compress-Archive `
            -Path $deploymentItems `
            -DestinationPath $packagePath `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path -LiteralPath $packagePath)) {
            throw "Deployment ZIP was not created: $packagePath"
          }

          $priorErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $packageBefore = az functionapp config appsettings list `
            --resource-group $rg `
            --name $app `
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" `
            --output tsv
          $packageBeforeExitCode = $LASTEXITCODE
          $ErrorActionPreference = $priorErrorActionPreference

          if ($packageBeforeExitCode -ne 0) {
            throw "Unable to read the current package pointer."
          }

          Write-Host "Deploying ZIP package to $app..."
          $ErrorActionPreference = "Continue"
          az functionapp deployment source config-zip `
            --resource-group $rg `
            --name $app `
            --src $packagePath `
            --output none
          $zipDeploymentExitCode = $LASTEXITCODE
          $ErrorActionPreference = $priorErrorActionPreference

          $ErrorActionPreference = "Continue"
          $packageAfter = az functionapp config appsettings list `
            --resource-group $rg `
            --name $app `
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" `
            --output tsv
          $packageAfterExitCode = $LASTEXITCODE
          $ErrorActionPreference = $priorErrorActionPreference

          if ($packageAfterExitCode -ne 0) {
            throw "Unable to read the package pointer after deployment."
          }

          if (
            [string]::IsNullOrWhiteSpace($packageAfter) -or
            $packageAfter -eq $packageBefore
          ) {
            throw "ZIP deployment did not advance the package pointer."
          }

          if ($zipDeploymentExitCode -ne 0) {
            Write-Warning (
              "Kudu returned exit code $zipDeploymentExitCode after the " +
              "package pointer advanced. Health verification will determine success."
            )
          } else {
            Write-Host "Azure ZIP deployment command completed."
          }

          # Post-deploy health check (cold-start safe)
          $health = "https://hope-ai-api-staging.azurewebsites.net/api/version"
          $ok = $false
          for ($i = 1; $i -le 24; $i++) {
            Start-Sleep -Seconds 5
            $h = Invoke-WebRequest -Method GET -Uri $health -SkipHttpErrorCheck
            Write-Host "Health try #${i}: $($h.StatusCode) $health"
            if ($h.StatusCode -eq 200) { $ok = $true; break }
            if ($h.Content) { Write-Host $h.Content }
          }

          if (-not $ok) {
            throw "Post-deploy health check failed after retries."
          }

  record-staging-evidence:
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Preview
    permissions: {}
    steps:
      - name: Record verified staging deployment evidence
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            $env:EVENT_NAME -cne 'push' -or
            $env:TARGET_REF -cne 'refs/heads/main' -or
            $env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$' -or
            $env:WORKFLOW_REF -cne "$($env:REPOSITORY)/.github/workflows/deploy-staging.yml@refs/heads/main"
          ) {
            throw 'Staging evidence is only valid for a main-branch push of a full commit SHA.'
          }

          $manifest = @{
            schema = 'hope-ai-api-staging-evidence/v1'
            repository_id = [long]$env:REPOSITORY_ID
            workflow_id = 240733052
            workflow_ref = $env:WORKFLOW_REF
            workflow_sha = $env:WORKFLOW_SHA
            run_id = [long]$env:RUN_ID
            run_attempt = [int]$env:RUN_ATTEMPT
            event = $env:EVENT_NAME
            ref = $env:TARGET_REF
            head_sha = $env:TARGET_SHA
            github_environment = 'Preview'
            azure_environment = 'staging'
            deployment_app = 'hope-ai-api-staging'
            version_endpoint = 'https://hope-ai-api-staging.azurewebsites.net/api/version'
            version_status = 200
            result = 'success'
          } | ConvertTo-Json -Compress

          $manifestPath = Join-Path $env:RUNNER_TEMP 'hope-ai-api-staging-evidence.json'
          Set-Content -LiteralPath $manifestPath -Value $manifest -Encoding utf8NoBOM

      - name: Upload verified staging deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: hope-ai-api-staging-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hope-ai-api-staging-evidence.json
          if-no-files-found: error
          retention-days: 90
